# LOCAL variant (maintainer setup).
#
# Publishes RabbitMQ + Redis onto an external `shared_net` network so other
# stacks — e.g. the OTel pipeline's `OTel/docker-compose.local.yml` — can reach
# them by service name instead of localhost.
#
#   docker network create shared_net      # once
#   docker compose -f rabbit/docker-compose.local.yml up -d

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - shared_net

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: shared_net
