# LOCAL variant (maintainer setup).
#
# Puts RabbitMQ + Redis + the workers on an external `shared_net` network so
# other stacks — e.g. the OTel pipeline's `OTel/docker-compose.local.yml` — can
# reach the same broker by service name.
#
#   docker network create shared_net      # once
#   docker compose -f rabbit/docker-compose.local.yml up --build

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - shared_net

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - shared_net

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: uv run python consumer.py
    environment:
      RABBITMQ_HOST: rabbitmq
    networks:
      - shared_net
    depends_on:
      - rabbitmq

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: uv run celery -A tasks worker --loglevel=info
    environment:
      REDIS_HOST: redis
    networks:
      - shared_net
    depends_on:
      - redis

networks:
  shared_net:
    external: true
    name: shared_net
