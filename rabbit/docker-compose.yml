# Self-contained infrastructure for the RabbitMQ / Celery / Redis examples.
#
# These examples run as plain Python scripts on your host and connect to
# localhost. Start the infra first, then run the scripts:
#
#   docker compose -f rabbit/docker-compose.yml up -d
#   uv run python rabbit/redis_cache.py        # Redis cache-aside demo
#   ...see rabbit/README.md for the rest...
#
#   RabbitMQ management UI: http://localhost:15672  (guest / guest)

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP (pika / celery connect here)
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"     # celery broker/backend + redis_cache.py
