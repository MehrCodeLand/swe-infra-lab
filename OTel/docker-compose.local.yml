# LOCAL variant (maintainer setup) — mirrors the original project layout.
#
# Here RabbitMQ / Redis are NOT bundled; they are expected to already be running
# on an external `shared_net` Docker network (started from a separate infra
# stack — e.g. `rabbit/docker-compose.local.yml`). Only the traced app services
# and Jaeger are defined here.
#
#   docker network create shared_net      # once
#   docker compose -f OTel/docker-compose.local.yml up --build

services:
  publisher:
    build:
      context: ..
      dockerfile: OTel/Dockerfile.local
    command: uv run uvicorn publisher.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    networks:
      - shared_net
    depends_on:
      - jaeger

  consumer:
    build:
      context: ..
      dockerfile: OTel/Dockerfile.local
    command: uv run python -m consumer.worker
    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    networks:
      - shared_net
    depends_on:
      - jaeger

  llm_worker:
    build:
      context: ..
      dockerfile: OTel/Dockerfile.local
    command: uv run python -m llm_worker.worker
    environment:
      RABBITMQ_HOST: rabbitmq
    networks:
      - shared_net
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: shared_net
